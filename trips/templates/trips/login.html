<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Login    |   TripWithMe</title>
    </head>
    <body>

        <h1>Login</h1>

        {% if message %}
            <p>{{ message }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <input type="text" name="username">
            <input type="password" name="password">
            <input type="submit" value="Login">

        </form>

        <p>
            Don't you have an account?
            <a href ="{% url 'register' %}">Register</a>
        </p>
    </body>
</html>
